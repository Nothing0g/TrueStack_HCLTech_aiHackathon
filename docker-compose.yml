services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_NAME: TrueStack University Assistant
      DATABASE_PATH: /app/storage/university.db
      CHROMA_PATH: /app/storage/chroma
      DOCUMENTS_PATH: /app/data/documents
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      MOCK_LLM: ${MOCK_LLM:-false}
      TOP_K: ${TOP_K:-5}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-12}
      OCR_DPI: ${OCR_DPI:-140}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      HF_HOME: /root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 60s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
